<style>
.auth{display:flex;justify-content:center;padding:32px 16px 64px;background:linear-gradient(180deg,#f3faf4,#fff)}
.auth-card{width:100%;max-width:420px;background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 10px 40px rgba(11,93,42,.12);border-top:5px solid #4CAF2F}
.auth-card h1{margin:0 0 6px;font-size:1.7rem;color:#0B5D2A}
.auth-sub{margin:0 0 22px;color:#5b6b60;font-size:.95rem}
.auth-card p{margin:0 0 16px}
.auth-card label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:#1f2d24}
.auth-card input[type=text],.auth-card input[type=email],.auth-card input[type=password]{width:100%;padding:12px 14px;font-size:16px;border:1.5px solid #cfdcd2;border-radius:10px;outline:none;box-sizing:border-box;transition:border-color .2s,box-shadow .2s}
.auth-card input:focus{border-color:#4CAF2F;box-shadow:0 0 0 3px rgba(76,175,47,.2)}
.auth-card p:has(input[type=checkbox]) label{display:inline;font-weight:400}
.auth-card input[type=checkbox]{margin-left:6px;accent-color:#0B5D2A}
.auth-card .errorlist{list-style:none;padding:0;margin:0 0 10px;color:#b3261e;font-size:.85rem}
.auth-card .helptext{display:block;font-size:.8rem;color:#6b7a70;margin-top:4px}
.auth-btn{width:100%;padding:13px;border:0;border-radius:10px;background:#0B5D2A;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
.auth-btn:hover{background:#4CAF2F}
.auth-links,.auth-foot{text-align:center;font-size:.9rem;margin:16px 0 0}
.auth-card a{color:#0B5D2A;font-weight:600;text-decoration:none}
.auth-card a:hover{text-decoration:underline}
.auth-or{display:flex;align-items:center;gap:12px;margin:22px 0;color:#8a978e;font-size:.85rem}
.auth-or:before,.auth-or:after{content:"";flex:1;height:1px;background:#e0e8e2}
.auth-google{display:block;text-align:center;padding:12px;border:1.5px solid #cfdcd2;border-radius:10px;color:#1f2d24!important}
.auth-google:hover{background:#f3faf4;text-decoration:none!important}
</style>
